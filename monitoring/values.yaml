# monitoring/values.yaml
# Helm values for the prometheus-community/kube-prometheus-stack chart.
# Keeps resource requests low (CloudLabs student subscription has limited
# node capacity) and exposes Grafana with a known default password for
# demonstration/screenshot purposes.

grafana:
  adminPassword: "KoalaTechMonitor2026!"   # change before any real deployment
  service:
    type: ClusterIP        # accessed via kubectl port-forward, per your existing pattern
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "koalatech"
          orgId: 1
          folder: "KoalaTech"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/koalatech

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 800Mi
    retention: 3d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# Node exporter and kube-state-metrics ship enabled by default in this
# chart and are what provide Kubernetes/infrastructure-level metrics
# (node CPU/memory, pod counts, deployment status) alongside application
# metrics scraped via the ServiceMonitor below.
