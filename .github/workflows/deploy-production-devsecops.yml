name: Deploy to Production (Terraform + Security + Monitoring)

on:
  push:
    branches:
      - main

env:
  IMAGE_SHA: ${{ github.event.inputs.image_sha || github.sha }}
  TF_WORKING_DIR: terraform
  ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME || 'sgdar81v1' }}
  AKS_DNS_PREFIX: ${{ vars.AKS_DNS_PREFIX || 'dar-dns-v1' }}

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_resource_group_name: ${{ vars.AKS_RESOURCE_GROUP }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME || 'sgdar81v1' }}
      TF_VAR_aks_cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
      TF_VAR_aks_dns_prefix: ${{ vars.AKS_DNS_PREFIX || 'dar-dns-v1' }}
      TF_VAR_aks_node_count: 3
      TF_VAR_aks_node_vm_size: Standard_D2s_v3
      TF_VAR_environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Import existing Azure resources if present
        run: |
          set +e

          RG_ID=$(az group show --name "${{ vars.AKS_RESOURCE_GROUP }}" --query id -o tsv 2>/dev/null)
          if [ -n "$RG_ID" ]; then
            terraform import azurerm_resource_group.rg "$RG_ID" || true
          fi

          ACR_ID=$(az acr show --name "${{ vars.ACR_NAME }}" --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" --query id -o tsv 2>/dev/null)
          if [ -n "$ACR_ID" ]; then
            terraform import azurerm_container_registry.acr "$ACR_ID" || true
          fi

          STORAGE_ID=$(az storage account show --name "${{ env.STORAGE_ACCOUNT_NAME }}" --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" --query id -o tsv 2>/dev/null)
          if [ -n "$STORAGE_ID" ]; then
            terraform import azurerm_storage_account.storage_account "$STORAGE_ID" || true
          fi

          AKS_ID=$(az aks show --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" --name "${{ vars.AKS_CLUSTER_NAME }}" --query id -o tsv 2>/dev/null)
          if [ -n "$AKS_ID" ]; then
            terraform import azurerm_kubernetes_cluster.aks "$AKS_ID" || true
            terraform import azurerm_monitor_diagnostic_setting.aks_diagnostics "$AKS_ID|aks-diagnostics" || true
          fi

          LAW_ID=$(az monitor log-analytics workspace show --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" --workspace-name "dar81v1-law" --query id -o tsv 2>/dev/null)
          if [ -n "$LAW_ID" ]; then
            terraform import azurerm_log_analytics_workspace.monitoring "$LAW_ID" || true
          fi

          set -e

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload Terraform plan as evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-output
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

  build-scan-push:
    name: Build, Docker Scout Scan & Push ${{ matrix.service }}
    needs: terraform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image: koalatech-frontend
          - service: user-service
            image: koalatech-user-service
          - service: student-service
            image: koalatech-student-service
          - service: lecturer-service
            image: koalatech-lecturer-service
          - service: course-service
            image: koalatech-course-service
          - service: enrollment-service
            image: koalatech-enrollment-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_SHA }} \
            ./${{ matrix.service }}

      - name: Docker Scout - CVE scan
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_PAT }}
          command: cves
          image: local://${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_SHA }}
          only-severities: critical,high
          exit-code: false
          write-comment: false
          summary: true

      - name: Docker Scout - recommendations
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_PAT }}
          command: recommendations
          image: local://${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_SHA }}
          summary: true

      - name: Save Docker Scout evidence note
        run: |
          mkdir -p scout-reports
          echo "Docker Scout scanned ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_SHA }}. See the job summary and step logs for CVE and recommendation details." > scout-reports/${{ matrix.service }}.txt

      - name: Upload Docker Scout evidence note
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-${{ matrix.service }}
          path: scout-reports/${{ matrix.service }}.txt

      - name: Push Docker image
        run: docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ env.IMAGE_SHA }}

  deploy-production:
    name: Deploy Application to Production
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Resolve storage connection string
        run: |
          STORAGE_CONNECTION_STRING=$(az storage account show-connection-string \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --query connectionString \
            -o tsv)
          echo "STORAGE_CONNECTION_STRING=$STORAGE_CONNECTION_STRING" >> "$GITHUB_ENV"

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="$STORAGE_CONNECTION_STRING" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply production manifests
        run: kubectl apply -f kubernetes/production/

      - name: Update deployment images
        run: |
          kubectl set image deployment/frontend frontend=${{ env.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_SHA }} -n production
          kubectl set image deployment/user-service user-service=${{ env.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_SHA }} -n production
          kubectl set image deployment/student-service student-service=${{ env.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_SHA }} -n production
          kubectl set image deployment/lecturer-service lecturer-service=${{ env.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_SHA }} -n production
          kubectl set image deployment/course-service course-service=${{ env.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_SHA }} -n production
          kubectl set image deployment/enrollment-service enrollment-service=${{ env.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_SHA }} -n production

      - name: Wait for production rollouts
        run: |
          kubectl rollout status deployment/frontend -n production --timeout=300s
          kubectl rollout status deployment/user-service -n production --timeout=300s
          kubectl rollout status deployment/student-service -n production --timeout=300s
          kubectl rollout status deployment/lecturer-service -n production --timeout=300s
          kubectl rollout status deployment/course-service -n production --timeout=300s
          kubectl rollout status deployment/enrollment-service -n production --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

  monitoring:
    name: Deploy & Validate Monitoring
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Add prometheus-community repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy/Upgrade kube-prometheus-stack
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f monitoring/values.yaml \
            --wait --timeout 10m

      - name: Apply custom ServiceMonitor and dashboard
        run: |
          kubectl apply -f monitoring/service-monitor.yaml -n monitoring
          kubectl apply -f monitoring/grafana-dashboard-configmap.yaml -n monitoring

      - name: Validate Prometheus and Grafana
        run: |
          kubectl get pods -n monitoring
          kubectl rollout status deployment/monitoring-grafana -n monitoring --timeout=300s
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 &
          sleep 8
          curl -s http://localhost:9090/-/ready && echo "Prometheus is ready"
          kubectl port-forward -n monitoring svc/monitoring-grafana 3000:80 &
          sleep 8
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login | grep -q "200" && echo "Grafana is reachable"