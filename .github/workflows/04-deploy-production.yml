name: Deploy to Production (Terraform + Security + Monitoring)

# Extends the Week08 CI/CD pipeline with:
#   1. Terraform  - automated infrastructure provisioning (before build/deploy)
#   2. Docker Scout - container vulnerability scanning (after build, before push/deploy)
#   3. Prometheus/Grafana - monitoring deployment + validation (after app deploy)
#
# Trigger: manual dispatch with the staging-validated commit SHA, matching the
# existing production promotion pattern used in this project.

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Staging-validated commit SHA to promote to production"
        required: true

env:
  TF_WORKING_DIR: terraform
  SERVICES: "user-service student-service lecturer-service course-service enrollment-service frontend"

jobs:
  # ------------------------------------------------------------------
  # 1. INFRASTRUCTURE AS CODE
  #    Runs first: any infra drift or new resources (e.g. a monitoring
  #    namespace, a new Log Analytics workspace) can be reviewed before the
  #    app is deployed or monitoring is installed.
  # ------------------------------------------------------------------
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    environment: production
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    env:
      TF_VAR_resource_group_name: ${{ vars.AKS_RESOURCE_GROUP }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME || 'sgdar81v1' }}
      TF_VAR_aks_cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
      TF_VAR_aks_dns_prefix: ${{ vars.AKS_DNS_PREFIX || 'dar-dns-v1' }}
      TF_VAR_aks_node_count: 3
      TF_VAR_aks_node_vm_size: Standard_D2s_v3
      TF_VAR_environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Upload plan as evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-output
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      - name: Terraform Apply (optional)
        if: ${{ vars.TERRAFORM_APPLY == 'true' }}
        run: terraform apply -input=false -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

  # ------------------------------------------------------------------
  # 2. BUILD IMAGES
  # ------------------------------------------------------------------
  build:
    name: Build & Push Images
    needs: terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, student-service, lecturer-service, course-service, enrollment-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.image_sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build image
        run: |
          docker build -t ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.event.inputs.image_sha }} \
            ./${{ matrix.service }}

      # --------------------------------------------------------------
      # 3. SECURITY SCANNING - Docker Scout
      #    Placed immediately after build and BEFORE push/deploy, so a
      #    critical/high vulnerability can block promotion before the
      #    image ever reaches the cluster.
      # --------------------------------------------------------------
      - name: Docker Scout - CVE scan
        id: scout-cves
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.event.inputs.image_sha }}
          only-severities: critical,high
          exit-code: false           # set true once you've remediated known issues, to enforce the gate
          write-comment: false
          summary: true

      - name: Docker Scout - recommendations
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.event.inputs.image_sha }}
          summary: true

      - name: Save Docker Scout report as evidence
        run: |
          mkdir -p scout-reports
          echo "Scout scan for ${{ matrix.service }} completed - see job summary for full CVE/recommendation output" \
            > scout-reports/${{ matrix.service }}-scout-summary.txt

      - name: Upload Docker Scout evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-${{ matrix.service }}
          path: scout-reports/

      - name: Push image (post security gate)
        run: docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.event.inputs.image_sha }}

  # ------------------------------------------------------------------
  # 4. APPLICATION DEPLOYMENT (existing step, kept as-is)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}

          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Deploy manifests
        run: |
          for svc in ${{ env.SERVICES }}; do
            kubectl set image deployment/$svc $svc=${{ vars.ACR_NAME }}.azurecr.io/$svc:${{ github.event.inputs.image_sha }}
          done
          kubectl rollout status deployment/user-service
          kubectl rollout status deployment/frontend

  # ------------------------------------------------------------------
  # 5. MONITORING AND OBSERVABILITY - Prometheus + Grafana
  #    Runs after deploy so it can immediately validate metrics are
  #    flowing from the just-deployed application and cluster.
  # ------------------------------------------------------------------
  monitoring:
    name: Deploy & Validate Monitoring
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}

          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Add prometheus-community repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy/Upgrade kube-prometheus-stack
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f monitoring/values.yaml \
            --wait --timeout 10m

      - name: Apply custom ServiceMonitors and dashboard
        run: |
          kubectl apply -f monitoring/service-monitor.yaml -n monitoring
          kubectl apply -f monitoring/grafana-dashboard-configmap.yaml -n monitoring

      - name: Validate Prometheus is collecting metrics
        run: |
          kubectl rollout status deployment/monitoring-kube-prometheus-operator -n monitoring
          kubectl get pods -n monitoring
          kubectl exec -n monitoring deploy/monitoring-kube-prometheus-operator -- true || true
          echo "Prometheus targets check:"
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 &
          sleep 8
          curl -s http://localhost:9090/-/ready && echo "Prometheus is ready"

      - name: Validate Grafana is reachable
        run: |
          kubectl rollout status deployment/monitoring-grafana -n monitoring
          kubectl port-forward -n monitoring svc/monitoring-grafana 3000:80 &
          sleep 8
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login | grep -q "200" && echo "Grafana is reachable"
